---
name: CI
'on':
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pylint bandit yamllint imapclient pyyaml

      - name: Lint Python
        run: pylint server.py email_check.py

      - name: Security scan
        run: bandit -ll server.py email_check.py

      - name: Lint shell and YAML
        run: |
          shellcheck install.sh
          yamllint .

      - name: Smoke test server
        run: |
          ./server.py --port 8080 --dry-run --data-dir /tmp/bell &
          sleep 2
          curl -fsS http://localhost:8080/api/status
          curl -fsS -X POST 'http://localhost:8080/api/ding?count=2'
          curl -fsS http://localhost:8080/ | grep -q 'Bell Control'
