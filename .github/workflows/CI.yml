---
name: CI
'on':
  pull_request:
  push:
    branches:
      - master

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install imapclient yamllint flake8

      - name: Lint code.
        run: |
          yamllint .
          flake8 --max-line-length 120 --ignore=E402
